<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="608" viewBox="0 0 1080 608">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0508"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <pattern id="diag" patternUnits="userSpaceOnUse" width="40" height="40" patternTransform="rotate(45)">
      <rect width="40" height="40" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="40" stroke="#dc143c" stroke-width="1" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1080" height="608" fill="url(#bg)"/>
  <rect width="1080" height="608" fill="url(#diag)"/>
  <!-- 边框 -->
  <rect x="24" y="24" width="1032" height="560" fill="none" stroke="#dc143c" stroke-width="3"/>
  <rect x="34" y="34" width="1012" height="540" fill="none" stroke="#dc143c" stroke-width="1" opacity="0.5"/>
  <!-- BREAKING 印章 -->
  <g transform="translate(60,60)">
    <rect width="220" height="52" fill="#dc143c"/>
    <text x="110" y="35" font-family="'Courier New',monospace" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="3">🚨 BREAKING</text>
  </g>
  <!-- 档案号 -->
  <text x="1000" y="95" font-family="'Courier New',monospace" font-size="18" fill="#dc143c" text-anchor="end" letter-spacing="2">№ 057 / 057 · CLASSIFIED</text>
  <!-- 主标题 -->
  <text x="60" y="200" font-family="Georgia,serif" font-size="68" font-weight="900" fill="#f0f0f4">六届世界杯 0 冠</text>
  <text x="60" y="270" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#dc143c">西班牙第91分钟补时绝杀</text>
  <!-- 比分牌 -->
  <g transform="translate(60,320)">
    <rect width="360" height="120" fill="#18181c" stroke="#dc143c" stroke-width="2"/>
    <text x="20" y="42" font-family="'Courier New',monospace" font-size="14" fill="#7a7a82">2026 世界杯 1/8 决赛 · AT&amp;T 体育场</text>
    <text x="60" y="90" font-family="Georgia,serif" font-size="40" font-weight="900" fill="#f0f0f4">葡萄牙</text>
    <text x="200" y="90" font-family="Georgia,serif" font-size="52" font-weight="900" fill="#dc143c">0 : 1</text>
    <text x="300" y="90" font-family="Georgia,serif" font-size="32" font-weight="900" fill="#7a7a82">西班牙</text>
  </g>
  <!-- 绝杀标记 -->
  <g transform="translate(460,330)">
    <text x="0" y="0" font-family="'Courier New',monospace" font-size="16" fill="#dc143c">⚽ 91' 绝杀</text>
    <text x="0" y="28" font-family="Georgia,serif" font-size="28" font-weight="900" fill="#f0f0f4">梅里诺</text>
    <text x="0" y="58" font-family="'Courier New',monospace" font-size="13" fill="#7a7a82">Mikel Merino</text>
    <text x="0" y="100" font-family="'Courier New',monospace" font-size="16" fill="#dc143c">💧 41 岁 · 最后一舞</text>
    <text x="0" y="128" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#f0f0f4">泪洒混采区</text>
  </g>
  <!-- 名言 -->
  <g transform="translate(60,490)">
    <text x="0" y="0" font-family="Georgia,serif" font-size="24" font-style="italic" fill="#d6d6db">「我已倾尽所有，问心无愧地离开。」</text>
    <text x="0" y="28" font-family="'Courier New',monospace" font-size="13" fill="#7a7a82">— CA7，2026 世界杯 1/8 决赛被淘汰后</text>
  </g>
  <!-- 数据条 -->
  <g transform="translate(820,490)" font-family="'Courier New',monospace" fill="#7a7a82" font-size="14">
    <text x="0" y="0">六届 · 9 场淘汰赛</text>
    <text x="0" y="22">仅 1 球 · 0 冠军</text>
  </g>
  <!-- 底部水印 -->
  <text x="540" y="580" font-family="'Courier New',monospace" font-size="11" fill="#3a3a40" text-anchor="middle">THE AVEIRO FILES · 头条 · 图片位置（替换 assets/images/report/r-57.jpg 即生效）</text>
  <!-- 占位说明 -->
  <text x="1020" y="580" font-family="'Courier New',monospace" font-size="10" fill="#dc143c" text-anchor="end" opacity="0.6">PLACEHOLDER</text>
</svg>
